[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "which-candidate"
version = "0.1.0"
description = "Auditable research on Democratic congressional candidate performance"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1,<4",
    "numpy>=2,<3",
    "scipy>=1.14,<2",
    "matplotlib>=3.9,<4",
    "pypdf>=5,<7",
    "pyarrow>=19,<30",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
which-candidate = "which_candidate.cli:main"

[tool.setuptools.packages.find]
include = ["which_candidate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
